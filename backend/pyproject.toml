[project]
name = "threadly-backend"
version = "0.1.0"
description = "Threadly Atelier AI Stylist Backend"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "fastapi>=0.142.4",
    "fastembed>=0.9.0",
    "langchain>=1.4",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-groq>=1.1.3",
    "langgraph>=1.2.14",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.4",
    "sqlalchemy>=2",
    "sse-starlette>=3.5.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
threadly-backend = "app.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
